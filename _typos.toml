# Configuration for `typos` (spell checker).

[files]
# Generated Unicode data table (row/column combining-diacritic code points and
# their official character names, e.g. "TAI VIET VOWEL UE") — not prose.
extend-exclude = ["twp-proxy/rowcolumn-diacritics.txt"]

[default.extend-words]
# `mch` = monospace cell height — a TWP unit, not a misspelling of "much".
mch = "mch"
