[package]
name = "twp-proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
# PTY wrapping
portable-pty = "0.9"

# Image generation
image = "0.25"
takumi = "1.4"

# Hashing for content-addressed image IDs
blake3 = "1"

# Base64 encoding for Kitty Graphics transmission payloads
base64 = "0.22"

# JSON parsing for the TWP Phase 1 payload format
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# parley re-exported types (FontFeature, Tag) for disabling ligatures —
# matches the version takumi 1.4 transitively depends on.
parley = "0.9"

# Signals (SIGWINCH) and termios
nix = { version = "0.29", features = ["term", "signal", "fs"] }

# Note: vte was specified as a dependency, but vte 0.15 (current) does not
# expose APC bytes via the Perform trait — APC strings go into the
# SosPmApcString state and are silently discarded. We implement a small
# byte-level state machine for APC framing instead. See src/parser.rs.

[dev-dependencies]
proptest = "1"

[[bin]]
name = "twp-proxy"
path = "src/main.rs"

[[bin]]
name = "twp-screenshot"
path = "src/bin/screenshot.rs"

[[bin]]
name = "twp-render"
path = "src/bin/render.rs"

[profile.release]
opt-level = 3
lto = "thin"
